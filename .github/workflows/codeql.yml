name: CodeQL

# Weekly static vulnerability analysis requiring AppKit compilation on macOS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Scheduled off-hour to avoid queue congestion.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (swift)
    # Run only on public repositories where hosted macOS runner minutes are permitted.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write
      # Required for the action to read workflow run status on private repos.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: swift
          # Bare swiftc project requires manual build mode instead of autobuild.
          build-mode: manual

      - name: Build
        env:
          ARCHS: arm64
        run: ./build.sh

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:swift"
