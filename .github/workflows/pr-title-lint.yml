name: PR title lint

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # Deliberately false. This workflow runs on `edited`, so retitling a PR to fix
  # a title-lint failure would otherwise cancel the run already in flight -- and
  # a cancelled check run is never superseded by a later success, leaving the
  # rollup FAILURE and the PR blocked with auto-merge armed but never firing.
  # The job validates a string in seconds; there is no slot worth reclaiming.
  cancel-in-progress: false

jobs:
  pr-title-lint:
    uses: burnett-madoc-corp/Claude-skills/.github/workflows/pr-title-lint-reusable.yml@main
