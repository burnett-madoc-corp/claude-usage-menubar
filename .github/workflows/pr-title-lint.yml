name: PR title lint

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # Prevent cancellation on title edit to avoid leaving stale check failures.
  cancel-in-progress: false

jobs:
  pr-title-lint:
    name: pr-title-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate title
        env:
          # Pass title via environment variable to prevent shell injection.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/validate_pr_title.py "$PR_TITLE"
