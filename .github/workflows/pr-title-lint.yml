name: PR title lint

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # Deliberately false. This workflow runs on `edited`, so retitling a PR to fix
  # a title-lint failure would otherwise cancel the run already in flight -- and
  # a cancelled check run is never superseded by a later success, leaving the
  # rollup FAILURE and the PR blocked with auto-merge armed but never firing.
  # The job validates a string in seconds; there is no slot worth reclaiming.
  cancel-in-progress: false

jobs:
  pr-title-lint:
    name: pr-title-lint
    # Hosted runners are refused while this repo is private (the org's Actions
    # quota is exhausted), so run on skynet until it is public. The validator is
    # stdlib Python either way. Fork PRs go to a hosted runner regardless, since
    # untrusted code must never reach the self-hosted box.
    runs-on: ${{ (github.event.repository.visibility == 'public' || github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","skynet"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate title
        env:
          # Via the environment, never interpolated into the shell: a PR title
          # is attacker-controlled text and `${{ }}` inside `run:` is a script
          # injection sink.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/validate_pr_title.py "$PR_TITLE"
