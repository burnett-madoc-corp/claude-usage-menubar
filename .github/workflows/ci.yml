name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded push should give up its slot, so pushes still cancel.
  # A review must NOT: cancelling an in-flight build leaves a FAILURE check run
  # that the replacement run's SUCCESS does not supersede. The rollup for that
  # SHA stays FAILURE and the PR is blocked with auto-merge armed but never
  # firing, until someone re-runs the cancelled run by hand.
  cancel-in-progress: ${{ github.event_name != 'pull_request_review' }}

permissions:
  contents: read

jobs:
  merge-gate:
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.draft == false }}
    name: merge-gate
    # This app links AppKit, so a real `swiftc` build only happens on macOS.
    # Hosted macOS runners are free for public repositories but refused on this
    # org's private ones (the Actions quota is exhausted -- a hosted job dies in
    # ~3s with a billing error and no runner assigned), so the runner is chosen
    # by visibility. While this repo is private the gate runs on skynet and
    # verifies structure and the committed charts only; the moment it is made
    # public the same job lands on macos-latest and additionally compiles and
    # self-tests, with no variable to flip. Fork PRs never touch the self-hosted
    # box. Do NOT close the gap with a `|| true` / `|| echo` pattern -- an
    # earlier version of this job did exactly that and reported green without
    # checking anything.
    runs-on: ${{ (github.event.repository.visibility == 'public' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'macos-latest' || fromJSON('["self-hosted","linux","x64","skynet"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Static checks (encoding, conflict markers, build.sh manifest)
        run: python3 .github/scripts/static_checks.py

      # Pure geometry/arithmetic over the committed SVGs -- no rendering, no
      # transcripts, so it runs anywhere. Catches the class of defect that
      # shipped in #26: a curve drawn through its own label, text past the
      # viewBox, and two charts stating different values for one quantity.
      - name: Chart checks (docs/charts/*.svg geometry and cross-chart numbers)
        run: python3 tools/check_charts.py

      - name: Build
        if: runner.os == 'macOS'
        run: ./build.sh

      - name: Self tests
        if: runner.os == 'macOS'
        run: build/ClaudeUsage.app/Contents/MacOS/ClaudeUsage --self-test
