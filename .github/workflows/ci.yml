name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel pushes in progress but preserve review builds to avoid permanent failed rollup states.
  cancel-in-progress: ${{ github.event_name != 'pull_request_review' }}

permissions:
  contents: read

jobs:
  merge-gate:
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.draft == false }}
    name: merge-gate
    # AppKit linkage requires a macOS runner for swiftc builds.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Static checks (encoding, conflict markers, build.sh manifest)
        run: python3 .github/scripts/static_checks.py

      # Validates SVG geometry, label clearance, and cross-chart data consistency.
      - name: Chart checks (docs/charts/*.svg geometry and cross-chart numbers)
        run: python3 tools/check_charts.py

      - name: Build
        run: ./build.sh

      - name: Self tests
        run: build/ClaudeUsage.app/Contents/MacOS/ClaudeUsage --self-test
